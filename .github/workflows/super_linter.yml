name: CI Lint

on:
  pull request:
    # path:
    #   - "src/**"
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Super-Linter
        # uses: super-linter/super-linter@b92721f792f381cedc002ecdbb9847a15ece5bb8
        uses: super-linter/super-linter@v7.1.0
        env:GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}